[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
memchr = "2.8"
memmap2 = "0.9"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
