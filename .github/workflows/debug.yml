name: toolchain

# Toolchain experiments on the shipped pipeline (lane/), official 20M data:
# BOLT post-link layout (sampled perf profile, or BOLT instrumentation, from
# another seed), libc choice (musl static as shipped vs glibc static), LLVM
# vector width, JCC-erratum padding, nightly rustc (newer LLVM). Every variant
# gets an exact-output check vs the shipped musl build, then an interleaved
# timing sweep on the same machine. (Runs from the debug.yml slot because
# workflow_dispatch needs a file name that exists on main.)
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds per sweep"
        required: false
        default: "15"
      reps:
        description: "JSON list; one job per entry (different runners)"
        required: false
        default: '["r1", "r2", "r3"]'
      thp:
        description: "THP mode to set (always = grader)"
        required: false
        default: "always"
      intel:
        description: "Require an Intel CPU (grader is Intel)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  tc:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(github.event.inputs.reps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name|L1i|L2|L3"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
          if [ "${{ github.event.inputs.intel }}" = 1 ] && ! grep -q GenuineIntel /proc/cpuinfo; then echo "::error::not Intel; re-run the job"; exit 1; fi
          echo ${{ github.event.inputs.thp }} | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          uname -r; rustc --version
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          lsb_release -ds; apt-cache search --names-only '^bolt-[0-9]+$' | sort
          for v in 22 21 20 19 18; do sudo apt-get install -y -qq bolt-$v >/dev/null 2>&1 && { echo "BOLT=/usr/lib/llvm-$v/bin/llvm-bolt" >> $GITHUB_ENV; echo "installed bolt-$v"; break; }; done
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}; echo "PERF=$PERF" >> $GITHUB_ENV
          rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1
          pip install --quiet polars
      - name: Data
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          G=tools/generator/target/release/generate
          $G --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
          $G --seed 7 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/t20" 2>&1 | tail -1
      - name: Build
        run: |
          FL="-C target-cpu=cascadelake -C relocation-model=static -C llvm-args=-x86-branches-within-32B-boundaries -C llvm-args=-x86-pad-max-prefix-size=5"
          M=x86_64-unknown-linux-musl; G=x86_64-unknown-linux-gnu; R="-C link-arg=-Wl,--emit-relocs"
          b() {  # label, target, extra rustflags, [toolchain]
            l=$1; t=$2; x=$3; tc=${4:-}
            (cd lane && RUSTFLAGS="$FL $x" CARGO_TARGET_DIR=/tmp/t-$l cargo $tc build --release -q --target $t 2>&1 | grep -E "^error" | tail -3) ; cp /tmp/t-$l/$t/release/pipeline ./$l || echo "build $l failed"
          }
          # shipped recipe (config.toml rustflags, musl, as in the Dockerfile)
          (cd lane && CARGO_TARGET_DIR=/tmp/t-base cargo build --release -q --target $M) && cp /tmp/t-base/$M/release/pipeline ./bin-base
          b bin-base2 $M ""
          b relocs $M "$R"
          b grelocs $G "$R"
          b ginstsrc $G "$R --cfg bolt_instr"
          cp grelocs bin-gdyn
          ls -l bin-* relocs grelocs
      - name: Counters
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          $PERF stat -e task-clock,cycles:u,instructions:u,branch-misses:u,L1-icache-load-misses:u,iTLB-load-misses:u env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./bin-base 2>&1 | tail -14 || true
          for e in frontend_retired.l1i_miss icache_64b.iftag_stall idq_uops_not_delivered.core dsb2mite_switches.penalty_cycles frontend_retired.dsb_miss; do
            $PERF stat -e cycles:u,$e:u env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./bin-base 2>&1 | grep -E "cycles|$e" || true
          done
      - name: BOLT
        run: |
          [ -n "$BOLT" ] && [ -x "$BOLT" ] || exit 0
          $BOLT --version | head -3
          echo "== hot code size (largest functions, bytes)"; nm -S --size-sort -C ./relocs | tail -12
          tr() { b=$1; for i in 1 2 3 4 5 6 7 8; do DATA_DIR="$RUNNER_TEMP/t20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) $b >/dev/null 2>&1; done; }
          export -f tr; export RUNNER_TEMP
          agg() {  # binary, out fdata
            if $PERF record -e cycles:u -j any,u -o lbr.data -- bash -c "tr $1" 2>/dev/null >/dev/null; then
              echo "LBR=1"; $BOLT $1 -p lbr.data -o $2 -aggregate-only 2>&1 | grep -E "BOLT-(ERROR)" | tail -3
            else
              echo "LBR=0"; $PERF record -F 20000 -o nl.data -- bash -c "tr $1" 2>&1 | tail -1
              $BOLT $1 -p nl.data -o $2 -aggregate-only -nl 2>&1 | grep -E "BOLT-(ERROR)" | tail -3
            fi
            ls -l $2
          }
          agg ./relocs prof.fdata
          agg ./grelocs gprof.fdata
          # exact edge counts: BOLT instrumentation of a glibc build that leaves via exit() (--cfg bolt_instr)
          $BOLT ./ginstsrc -instrument -instrumentation-file=$PWD/inst.fdata -o ./ginst 2>&1 | grep -E "BOLT-(ERROR)" | tail -4
          DATA_DIR="$RUNNER_TEMP/t20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./ginst >/dev/null 2>&1; echo "instrumented run exit=$?"; ls -l inst.fdata || true
          bo() {  # out, in, profile, opts...
            o=$1; i=$2; d=$3; shift 3
            $BOLT $i -o ./$o -data=$d "$@" > bo-$o.log 2>&1
            grep -E "BOLT-(INFO|WARNING|ERROR)" bo-$o.log | grep -vE "AVX512 instruction" | grep -E "ERROR|WARNING|profile|stale|non-simple|ignored|split|functions" | head -10 || true
            echo "AVX512 encoding warnings: $(grep -c 'AVX512 instruction' bo-$o.log)"
            [ -x ./$o ] && echo "== bolt $o ok" || echo "== bolt $o FAILED"
          }
          STD="-reorder-blocks=ext-tsp -reorder-functions=cdsort -split-functions -split-all-cold -icf=1 -use-gnu-stack -dyno-stats"
          bo bin-bolt_a ./relocs prof.fdata $STD
          grep -A3 -m3 "AVX512 instruction" bo-bin-bolt_a.log || true
          bo bin-bolt_b ./relocs prof.fdata -reorder-blocks=ext-tsp -reorder-functions=cdsort -use-gnu-stack
          bo bin-bolt_nr ./relocs prof.fdata -relocs=0 -reorder-blocks=ext-tsp -use-gnu-stack
          bo bin-bolt_c ./relocs prof.fdata $STD -x86-align-branch-boundary-hot-only -x86-branches-within-32B-boundaries
          bo bin-gbolt_s ./grelocs gprof.fdata $STD
          bo bin-gbolt_snr ./grelocs gprof.fdata -relocs=0 -reorder-blocks=ext-tsp -use-gnu-stack
          if [ -s inst.fdata ]; then
            bo bin-gbolt_i ./grelocs inst.fdata $STD
            bo bin-gbolt_ic ./grelocs inst.fdata $STD -x86-align-branch-boundary-hot-only -x86-branches-within-32B-boundaries
          fi
          ls -l bin-*
          # where do the bolted binaries crash?
          for f in bin-bolt_a bin-bolt_nr bin-gbolt_s; do [ -x $f ] || continue
            echo "== gdb $f"
            DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) timeout 120 gdb -q -batch -ex run -ex bt -ex 'x/4i $pc' ./$f 2>&1 | grep -E "SIGSEGV|SIGILL|SIGBUS|^#[0-9]|=>|exited" | head -12 || true
          done
      - name: Exact checks vs shipped build (timing set, seed 42)
        run: |
          a=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a" NCPU=$(nproc) ./bin-base
          echo "base ./bin-base" > v.txt
          for f in bin-*; do l=${f#bin-}; [ $l = base ] && continue
            o=$(mktemp -d)
            if DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$o" NCPU=$(nproc) ./$f; then
              r=$(cd scripts && python3 compare.py "$a" "$o" | tail -1); echo "$l vs base: $r"
              [ "$r" = MATCH ] && echo "$l ./$f" >> v.txt
            else echo "$l: run FAILED"; fi
          done
          cat v.txt
      - name: Sweep
        run: python3 tools/sweep.py "$RUNNER_TEMP/p20" ${{ github.event.inputs.rounds }} v.txt
