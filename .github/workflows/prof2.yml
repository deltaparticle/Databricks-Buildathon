name: kern

# Kernel / container overhead study (exp/kernel): native glibc vs native musl
# vs container, seccomp on/off, interleaved on one machine, under THP madvise
# and always; perf of the containerized run (system-wide, comm=pipeline).
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds"
        required: false
        default: "15"
      variants:
        description: "Variants file under tools/"
        required: false
        default: "kern_v1.txt"
      envs:
        description: "Extra env sets for the counters step (space separated, each VAR=VAL[,..])"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kern:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        thp: [madvise, always]
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name"; uname -r; free -g
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
          cat /proc/cmdline
          grep -E "INIT_ON_ALLOC|INIT_ON_FREE|TRANSPARENT_HUGEPAGE|READ_ONLY_THP|PAGE_TABLE_ISOLATION" /boot/config-$(uname -r) || true
          grep . /sys/devices/system/cpu/vulnerabilities/* | sed 's|.*/||'
          sudo cat /sys/kernel/debug/fault_around_bytes 2>/dev/null || true
          docker info 2>/dev/null | grep -iE "Kernel|Runtime|seccomp|Security|cgroup" || true
      - name: THP
        run: |
          case "${{ matrix.thp }}" in always*) echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled ;; esac
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          grep . /sys/kernel/mm/transparent_hugepage/shmem_enabled /sys/kernel/mm/transparent_hugepage/khugepaged/defrag 2>/dev/null || true
      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          (cd lane && cargo build --release -q) && cp lane/target/release/pipeline lanebin
          docker build -q -t cur . >/dev/null
          docker create --name xcur cur >/dev/null && docker cp xcur:/pipeline ./muslbin && docker rm xcur >/dev/null
          gcc -O2 -static -o diag tools/diag.c
          printf 'int main(void){return 0;}\n' > noop.c && gcc -O2 -static -o noop noop.c
          for b in diag noop; do
            mkdir -p img-$b && cp $b img-$b/ && printf 'FROM scratch\nCOPY %s /%s\nUSER 1000:1000\nCMD ["/%s"]\n' $b $b $b > img-$b/Dockerfile
            docker build -q -t $b img-$b >/dev/null
          done
          # extra variant images: tools/kern_build.sh may build more (label -> image name)
          [ -f tools/kern_build.sh ] && bash tools/kern_build.sh || true
          docker images | head -20
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
      - name: Data (official generator, 20M, seed 42)
        run: |
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
          du -sh "$RUNNER_TEMP/p20"
      - name: Diag
        run: |
          FLAGS="--network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --memory 14g --memory-swap 14g --user 1000:1000 --cpus $(nproc)"
          echo "== native"; ./diag
          echo "== docker"; docker run --rm $FLAGS diag
          echo "== docker seccomp=unconfined"; docker run --rm $FLAGS --security-opt seccomp=unconfined diag
      - name: Counters (native musl, vmstat deltas, syscalls)
        run: |
          K="thp_fault_alloc thp_fault_fallback thp_split_pmd pgfault pgalloc_normal pgalloc_dma32 pgfree thp_zero_page_alloc"
          for e in "" ${{ github.event.inputs.envs || '' }}; do
            for i in 1 2; do
              cp /proc/vmstat v0
              env $e DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_TIMING=1 ./muslbin 2>&1 | grep -E "ms:" | sed 's/.*total=/total=/'
              cp /proc/vmstat v1
              echo "env[$e]: $(for k in $K; do a=$(grep "^$k " v0 | cut -d' ' -f2); b=$(grep "^$k " v1 | cut -d' ' -f2); echo -n "$k=$((b-a)) "; done)"
            done
          done
          DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_TIMING=1 XL_MEMDBG=1 ./muslbin 2>&1 | grep -E "^\[mem\]|ms:"
          sudo apt-get install -y -qq strace >/dev/null 2>&1 || true
          strace -f -c -o st.txt env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./muslbin; head -25 st.txt
      - name: Exact (variant images vs cur)
        run: |
          pip install --quiet polars
          FLAGS="--network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 14g --memory-swap 14g --user 1000:1000 --cpus $(nproc)"
          ref=$(mktemp -d); chmod 777 $ref
          docker run --rm $FLAGS -v "$RUNNER_TEMP/p20":/data:ro -v $ref:/output -e NCPU=$(nproc) cur
          for img in $(docker images --format '{{.Repository}}' | grep '^v-' || true); do
            o=$(mktemp -d); chmod 777 $o
            docker run --rm $FLAGS -v "$RUNNER_TEMP/p20":/data:ro -v $o:/output -e NCPU=$(nproc) $img
            echo "$img vs cur: $(cd scripts && python3 compare.py "$o" "$ref" | tail -1)"
          done
      - name: Timing (interleaved)
        run: python3 tools/kern.py "$RUNNER_TEMP/p20" ${{ github.event.inputs.rounds || '15' }} tools/${{ github.event.inputs.variants || 'kern_v1.txt' }}
      - name: perf (container, system-wide, comm pipeline)
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          FLAGS="--network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --memory 14g --memory-swap 14g --user 1000:1000 --cpus $(nproc)"
          for img in cur $(docker images --format '{{.Repository}}' | grep '^v-' | head -2 || true); do
            o=$(mktemp -d); chmod 777 $o
            id=$(docker create $FLAGS -v "$RUNNER_TEMP/p20":/data:ro -v $o:/output -e NCPU=$(nproc) $img)
            sudo $PERF record -a -g -F 4999 -o perf-$img.data -- docker start -a $id >/dev/null 2>&1
            docker rm $id >/dev/null
            echo "===== $img: by dso (comm pipeline)"
            sudo $PERF report -i perf-$img.data --comm pipeline --no-children --sort dso --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -5
            echo "===== $img: kernel symbols (comm pipeline)"
            sudo $PERF report -i perf-$img.data --comm pipeline --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | grep "\[k\]" | head -30
            echo "===== $img: all comms"
            sudo $PERF report -i perf-$img.data --no-children --sort comm --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -12
          done
