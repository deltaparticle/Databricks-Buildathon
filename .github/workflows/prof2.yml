name: prof2

# Where does the container add time? Internal phase timings inside the
# container, with and without --cpus, docker's own StartedAt/FinishedAt, and a
# noop that touches as much memory as the pipeline (exit teardown cost).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prof2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          docker build -q -t cur . >/dev/null
          printf '#include <stdlib.h>\n#include <string.h>\nint main(int c,char**v){size_t n=c>1?strtoull(v[1],0,10)<<20:0; if(n){char*p=malloc(n); memset(p,1,n); return p[n/2]==2;} return 0;}\n' > mem.c
          gcc -O2 -static -o mem mem.c
          mkdir -p memimg && cp mem memimg/ && printf 'FROM scratch\nCOPY mem /mem\nUSER 1000:1000\nENTRYPOINT ["/mem"]\n' > memimg/Dockerfile
          docker build -q -t mem memimg >/dev/null
      - name: Data
        run: tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Runs
        run: |
          N=$(nproc)
          FLAGS="--network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --memory 14g --memory-swap 14g --user 1000:1000"
          one() {  # label, extra flags, image, args...
            label=$1; extra=$2; img=$3; shift 3
            out=$(mktemp -d); chmod 777 "$out"
            s=$(date +%s.%N)
            id=$(docker create $FLAGS $extra -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU=$N -e XL_TIMING=1 "$img" "$@")
            c=$(date +%s.%N)
            docker start -a "$id" > /dev/null 2> err.txt
            e=$(date +%s.%N)
            st=$(docker inspect -f '{{.State.StartedAt}} {{.State.FinishedAt}}' "$id")
            docker rm "$id" > /dev/null
            r=$(date +%s.%N)
            inner=$(python3 -c "
          from datetime import datetime
          a,b='$st'.split()
          f=lambda x: datetime.strptime(x[:26].rstrip('Z'), '%Y-%m-%dT%H:%M:%S.%f')
          print(round((f(b)-f(a)).total_seconds(),3))")
            tot=$(grep -o 'total=[0-9.]*' err.txt | head -1)
            echo "$label create=$(python3 -c "print(round($c-$s,3))") start-to-exit=$(python3 -c "print(round($e-$c,3))") rm=$(python3 -c "print(round($r-$e,3))") docker_started_to_finished=$inner internal_$tot"
          }
          for i in 1 2 3 4 5; do
            one cur_cpus "--cpus $N" cur
            one cur_nocpus "" cur
            one mem0 "--cpus $N" mem 0
            one mem500 "--cpus $N" mem 500
          done
          echo "== cur, internal phases, with --cpus"
          out=$(mktemp -d); chmod 777 "$out"
          docker run --rm $FLAGS --cpus $N -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU=$N -e XL_TIMING=1 cur 2>&1 >/dev/null | grep "ms:"
          echo "== native, internal phases"
          docker create --name x cur >/dev/null; docker cp x:/pipeline ./pipeline; docker rm x >/dev/null
          for i in 1 2 3; do /usr/bin/time -f "native wall=%e" env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$N XL_TIMING=1 ./pipeline 2>&1 | grep -E "ms:|wall="; done
