name: edge

# Adversarial exactness: inject malformed and odd lines (wrong comma counts,
# stray quotes, empty and cut-short lines) into generated data at random
# positions, then diff each build's output against our Rust reference.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Space-separated git refs whose lane/ to test (besides this commit)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q
          (cd lane && cargo build --release -q) && cp lane/target/release/pipeline bin-cur
          echo cur > bins.txt
          for r in ${{ github.event.inputs.refs }}; do
            lab=$(printf '%s' "$r" | tr -c 'a-zA-Z0-9' '_')
            sha=$(git rev-parse -q --verify "$r^{commit}" || git rev-parse -q --verify "origin/$r^{commit}")
            git worktree add -q "/tmp/w-$lab" "$sha"
            (cd "/tmp/w-$lab/lane" && CARGO_TARGET_DIR=/tmp/t-$lab cargo build --release -q) && cp /tmp/t-$lab/release/pipeline bin-$lab && echo $lab >> bins.txt
          done
          pip install --quiet polars
      - name: Data
        run: |
          G=tools/generator/target/release/generate
          $G --seed 5 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/d1" >/dev/null 2>&1
          $G --seed 6 --events 4000000 --clicks 1000000 --output "$RUNNER_TEMP/d4" >/dev/null 2>&1
          for s in 1 2 3; do python3 tools/inject.py "$RUNNER_TEMP/d1" "$RUNNER_TEMP/x1_$s" $s; done
          python3 tools/inject.py "$RUNNER_TEMP/d4" "$RUNNER_TEMP/x4" 9
      - name: Diff against the reference
        run: |
          for d in x1_1 x1_2 x1_3 x4; do
            ref=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$ref" NCPU=$(nproc) ./target/release/shopping
            for b in $(cat bins.txt); do
              o=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$o" NCPU=$(nproc) ./bin-$b; code=$?
              echo "$d $b exit=$code: $(cd scripts && python3 compare.py "$o" "$ref" | tail -1)"
            done
          done
