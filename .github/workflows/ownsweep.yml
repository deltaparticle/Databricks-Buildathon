name: ownsweep

# Build variants of our own pipeline (RUSTFLAGS / build-time env), check each
# is exact against the base build on v5 20M data, then time them interleaved
# on one machine with tools/sweep.py.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Semicolon-separated label=ENV ASSIGNMENTS (RUSTFLAGS and SHOP_* build vars)"
        required: true
      rounds:
        required: false
        default: "12"
      parts:
        required: false
        default: '["a", "b"]'
      base_flags:
        required: false
        default: "-C target-cpu=cascadelake"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event.inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Data
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Build variants
        env:
          VARIANTS: ${{ github.event.inputs.variants }}
        run: |
          pip install --quiet polars
          BF="${{ github.event.inputs.base_flags }}"
          RUSTFLAGS="$BF" CARGO_TARGET_DIR=/tmp/t-base cargo build --release -q && cp /tmp/t-base/release/shopping bin-base
          echo "base ./bin-base" > v.txt; echo "base2 ./bin-base" >> v.txt
          ref=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$ref" NCPU=$(nproc) ./bin-base
          printf '%s\n' "$VARIANTS" | tr ';' '\n' > specs.txt
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            label=${spec%%=*}; assigns=${spec#*=}; EXTRA=""
            case "$label" in pgo*)
              # profile-guided: instrumented build, train on other seeds, rebuild with the profile
              rustup component add llvm-tools >/dev/null 2>&1; PD=$(find ~/.rustup -name llvm-profdata | head -1)
              [ -f "$RUNNER_TEMP/tr7/manifest.json" ] || tools/generator/target/release/generate --seed 7 --events 4000000 --clicks 1000000 --output "$RUNNER_TEMP/tr7" >/dev/null 2>&1
              [ -f "$RUNNER_TEMP/tr8/manifest.json" ] || tools/generator/target/release/generate --seed 8 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/tr8" >/dev/null 2>&1
              (eval "export $assigns"; RUSTFLAGS="$RUSTFLAGS -Cprofile-generate=/tmp/pgo-$label" CARGO_TARGET_DIR=/tmp/t-$label-gen cargo build --release -q)                 && for d in tr7 tr8; do DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) /tmp/t-$label-gen/release/shopping; done                 && ls /tmp/pgo-$label | head -3 && $PD merge -o /tmp/pgo-$label.profdata /tmp/pgo-$label/*.profraw                 && EXTRA="-Cprofile-use=/tmp/pgo-$label.profdata" ;;
            esac
            if (eval "export $assigns"; export RUSTFLAGS="$RUSTFLAGS $EXTRA"; CARGO_TARGET_DIR=/tmp/t-$label cargo build --release -q) && cp /tmp/t-$label/release/shopping bin-$label; then
              o=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$o" NCPU=$(nproc) ./bin-$label
              echo "$label output vs base: $(cd scripts && python3 compare.py "$o" "$ref" | tail -1)"
              echo "$label ./bin-$label" >> v.txt
            else echo "build $label failed"; fi
          done < specs.txt
          cat v.txt
      - name: Sweep
        run: python3 tools/sweep.py "$RUNNER_TEMP/p20" ${{ github.event.inputs.rounds }} v.txt
