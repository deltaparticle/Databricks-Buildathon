name: prof

# Where does the time go? Empty-container cost, raw input-read floors, and the
# shipped pipeline's own phase timings and counters, on official 20M data.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to profile (default: this one)"
        required: false

permissions:
  contents: read

jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name|L2|L3|NUMA node"; free -g
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
          cat /sys/kernel/mm/transparent_hugepage/enabled
          docker info 2>/dev/null | grep -E "Storage Driver|Cgroup|Kernel|Runtime"
      - name: Build
        run: |
          [ -n "${{ github.event.inputs.ref }}" ] && git checkout -q "${{ github.event.inputs.ref }}"
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          (cd lane && cargo build --release -q) && cp lane/target/release/pipeline lanebin
          gcc -O2 -pthread -o floor tools/floor.c
          printf 'int main(void){return 0;}\n' > noop.c && gcc -O2 -static -o noop noop.c
          mkdir -p noopimg && cp noop noopimg/ && printf 'FROM scratch\nCOPY noop /noop\nUSER 1000:1000\nCMD ["/noop"]\n' > noopimg/Dockerfile
          docker build -q -t noop noopimg >/dev/null
          docker build -q -t cur . >/dev/null
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
      - name: Data (official generator, 20M, seed 42)
        run: |
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
          du -sh "$RUNNER_TEMP/p20"; ls "$RUNNER_TEMP/p20/events" | wc -l
      - name: Container cost (noop vs pipeline, same flags)
        run: |
          run() {
            out=$(mktemp -d); chmod 777 "$out"
            s=$(date +%s.%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
              --cpus "$(nproc)" --memory 14g --memory-swap 14g --user 1000:1000 \
              -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU="$(nproc)" "$1" > /dev/null 2>&1
            e=$(date +%s.%N); echo "$1 wall=$(python3 -c "print(round($e-$s,3))")"
          }
          for i in 1 2 3 4 5 6; do run noop; run cur; done | tee c.txt
          python3 -c "
          import statistics as st
          r=[l.split() for l in open('c.txt')]
          for k in ('noop','cur'):
              w=[float(x[1][5:]) for x in r if x[0]==k]; print(k, 'median', round(st.median(w),3))"
      - name: Input read floors (native)
        run: |
          N=$(nproc)
          for m in touch sum pread touch sum pread; do ./floor $m "$RUNNER_TEMP/p20" $N; done
          ./floor sum "$RUNNER_TEMP/p20" 1
      - name: Pipeline phases (native, XL_TIMING)
        run: |
          for i in 1 2 3 4; do
            /usr/bin/time -f "wall=%e user=%U sys=%S maxrss=%MKB minflt=%R majflt=%F ctx=%c/%w" \
              env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_TIMING=1 ./lanebin 2>&1 | grep -E "\[v2b\] (ms|prof|rows)|wall="
          done
      - name: perf
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          $PERF stat -e task-clock,page-faults,context-switches,cpu-migrations,cycles,instructions env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./lanebin 2>&1 | tail -14
          $PERF record -F 9999 -g -o perf.data env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./lanebin 2>/dev/null >/dev/null
          echo "===== top symbols (self, incl. kernel)"
          $PERF report -i perf.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -45
          echo "===== by dso"
          $PERF report -i perf.data --no-children --sort dso --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -8
