name: annot

# Instruction-level profile of the shipped pipeline's hot functions
# (perf annotate on a build with line tables), on official 20M data.
on:
  workflow_dispatch:
    inputs:
      syms:
        description: "Space-separated symbol substrings to annotate"
        required: false
        default: "ev_loop ev_batch stage3 cl_loop bucket ck_batch run_clicks ev_purchase walk_runs pass_b"

permissions:
  contents: read

jobs:
  annot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          (cd lane && CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release -q) && cp lane/target/release/pipeline lanebin
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
      - name: Data
        run: tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Profile
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          for i in 1 2; do env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_TIMING=1 ./lanebin 2>&1 | grep "ms:"; done
          # several runs into one profile for more samples
          for i in 1 2 3 4 5 6; do $PERF record -q -F 19999 -o p$i.data env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./lanebin >/dev/null 2>&1; done
          echo "===== symbols (run 1)"
          $PERF report -i p1.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -40
          for s in ${{ github.event.inputs.syms }}; do
            full=$($PERF report -i p1.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | grep -F "$s" | head -1 | sed -E 's/^ +[0-9.]+% +\[\.\] //')
            [ -z "$full" ] && continue
            echo "===================== $full"
            for i in 1 2 3; do $PERF annotate -i p$i.data --stdio -l --no-source "$full" 2>/dev/null; done \
              | grep -E "^ +[0-9]+\.[0-9]+ " | awk '$1 >= 0.4' | sort -k1 -nr | head -45
            echo "----- hottest source lines"
            $PERF annotate -i p1.data --stdio -l "$full" 2>/dev/null | grep -E "^ +[0-9]+\.[0-9]+ +[a-z_/]+\.rs:[0-9]+" | sort -nr | head -25
          done
