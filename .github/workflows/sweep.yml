name: sweep

# Tuning sweeps of the shipped pipeline on official 20M data, interleaved on
# one machine per job: runtime knobs (env), compile-time knobs (option_env!
# rebuilds) and a profile-guided build. Winners still need lane.yml's exact
# checks before they ship.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds per sweep"
        required: false
        default: "12"
      parts:
        description: "JSON list of parts"
        required: false
        default: '["refs_madvise", "refs_always", "refs_always_b"]'
      refs:
        description: "For refs_* parts: space-separated git refs to time against this commit"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event.inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Data
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Build
        run: |
          cd lane
          cargo build --release -q && cp target/release/pipeline ../lanebin
          cd ..
          echo "base ./lanebin" > v.txt
          echo "base2 ./lanebin" >> v.txt
          build() {  # label, env assignments...
            label=$1; shift
            (cd lane && env "$@" CARGO_TARGET_DIR=/tmp/t-$label cargo build --release -q) && cp /tmp/t-$label/release/pipeline ./bin-$label && echo "$label ./bin-$label" >> v.txt || echo "build $label failed"
          }
          case "${{ matrix.part }}" in
            rt) cp tools/sweep_rt.txt v.txt ;;
            rt2) cp tools/sweep_rt2.txt v.txt ;;
            refs_*)
              case "${{ matrix.part }}" in *always*) echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled ;; esac
              cat /sys/kernel/mm/transparent_hugepage/enabled
              pip install --quiet polars
              for r in ${{ github.event.inputs.refs }}; do
                git fetch -q origin "$r" && git worktree add -q "/tmp/w-$r" FETCH_HEAD
                lab=$(printf '%s' "$r" | tr -c 'a-zA-Z0-9_' '_')
                (cd "/tmp/w-$r/lane" && CARGO_TARGET_DIR=/tmp/t-$lab cargo build --release -q) && cp /tmp/t-$lab/release/pipeline ./bin-$lab && echo "$lab ./bin-$lab" >> v.txt
                a=$(mktemp -d); b=$(mktemp -d)
                DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a" NCPU=$(nproc) ./bin-$lab; DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$b" NCPU=$(nproc) ./lanebin
                echo "$lab output vs base: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
              done ;;
            conf_*)
              # the grader (GCP n2, kernel 6.1) runs THP "always"; CI defaults to "madvise"
              case "${{ matrix.part }}" in conf_always*) echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled ;; esac
              cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
              build ub11 XL_UB=11
              echo "r3_0 ./lanebin XL_R3=0" >> v.txt
              echo "ub11_r3_0 ./bin-ub11 XL_R3=0" >> v.txt
              pip install --quiet polars
              for v in "./lanebin XL_R3=0" "./bin-ub11" "./bin-ub11 XL_R3=0"; do
                a=$(mktemp -d); b=$(mktemp -d); set -- $v; bin=$1; shift
                env "$@" DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a" NCPU=$(nproc) $bin; DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$b" NCPU=$(nproc) ./lanebin
                echo "$v output vs base: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
              done ;;
            ct1)
              build bb14 XL_BB=14; build bb13 XL_BB=13; build ub11 XL_UB=11; build ub13 XL_UB=13
              build sub2048 XL_SUB_DEF=2048; build sub8192 XL_SUB_DEF=8192; build slab12 XL_SLABROWS=12; build slab14 XL_SLABROWS=14 ;;
            ct2)
              build cxr32 XL_CXRDIV=32; build cxr128 XL_CXRDIV=128; build heavy2 XL_HEAVY_DIV=2; build heavy8 XL_HEAVY_DIV=8
              build xrc2 XL_XRC=2; build xrc8 XL_XRC=8; build dec2_0 XL_DEC2=0; build ckpf0 XL_CKPF=0 ;;
            pgo)
              rustup component add llvm-tools >/dev/null 2>&1
              PD=$(find ~/.rustup -name llvm-profdata | head -1)
              FL="-C target-cpu=cascadelake -C relocation-model=static -C llvm-args=-x86-branches-within-32B-boundaries -C llvm-args=-x86-pad-max-prefix-size=5"
              (cd lane && RUSTFLAGS="$FL --cfg pgo_gen -Cprofile-generate=/tmp/pgo" CARGO_TARGET_DIR=/tmp/t-gen cargo build --release -q)
              G=tools/generator/target/release/generate
              for s in 7 1234 99; do $G --seed $s --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/tr$s" >/dev/null 2>&1
                DATA_DIR="$RUNNER_TEMP/tr$s" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) /tmp/t-gen/release/pipeline; rm -rf "$RUNNER_TEMP/tr$s"; done
              $G --seed 3 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/tr3" >/dev/null 2>&1
              DATA_DIR="$RUNNER_TEMP/tr3" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) /tmp/t-gen/release/pipeline
              ls /tmp/pgo | head; $PD merge -o /tmp/merged.profdata /tmp/pgo/*.profraw
              (cd lane && RUSTFLAGS="$FL -Cprofile-use=/tmp/merged.profdata" CARGO_TARGET_DIR=/tmp/t-use cargo build --release -q 2>&1 | tail -3)
              cp /tmp/t-use/release/pipeline ./bin-pgo && echo "pgo ./bin-pgo" >> v.txt
              # exact check on the timing set (trained on other seeds)
              a=$(mktemp -d); b=$(mktemp -d)
              DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a" NCPU=$(nproc) ./bin-pgo; DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$b" NCPU=$(nproc) ./lanebin
              pip install --quiet polars; echo "pgo output vs base: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
              rustc --version ;;
          esac
          cat v.txt | wc -l
      - name: Sweep
        run: python3 tools/sweep.py "$RUNNER_TEMP/p20" ${{ github.event.inputs.rounds }} v.txt
