name: sweep

# Stage-3 experiments: compile-time variants of the shipped pipeline, exact
# output check vs the base build on official 20M data, then interleaved timing
# with XL_TIMING phase laps (ev3a, scatter thread-ms) on one machine per job.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "label:ENV=V,ENV=V ... (compile-time knobs)"
        required: false
        default: "spf16:XL_SPF=16 spf32:XL_SPF=32"
      rounds:
        description: "Timing rounds"
        required: false
        default: "15"
      xprof:
        description: "label of a variant to also build with XL_XPROF (empty = none)"
        required: false
        default: ""
      runs:
        description: "Parallel jobs (JSON list)"
        required: false
        default: '["a","b"]'

permissions:
  contents: read

jobs:
  st3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(github.event.inputs.runs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name|L1d|L2|L3"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Data
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Build
        run: |
          (cd lane && cargo build --release -q) && cp lane/target/release/pipeline ./bin-base
          echo "base ./bin-base" > v.txt
          echo "base2 ./bin-base" >> v.txt
          for spec in ${{ github.event.inputs.variants }}; do
            label=${spec%%:*}; envs=${spec#*:}; envs=${envs//,/ }
            (cd lane && env $envs CARGO_TARGET_DIR=/tmp/t-$label cargo build --release -q) && cp /tmp/t-$label/release/pipeline ./bin-$label && echo "$label ./bin-$label" >> v.txt || echo "::error::build $label failed"
            if [ "$label" = "${{ github.event.inputs.xprof }}" ]; then
              (cd lane && env $envs XL_XPROF=1 CARGO_TARGET_DIR=/tmp/x-$label cargo build --release -q) && cp /tmp/x-$label/release/pipeline ./xp-$label
            fi
          done
          if [ -n "${{ github.event.inputs.xprof }}" ]; then
            (cd lane && XL_XPROF=1 CARGO_TARGET_DIR=/tmp/x-base cargo build --release -q) && cp /tmp/x-base/release/pipeline ./xp-base
          fi
          cat v.txt
      - name: Exact (each variant vs base, 20M)
        run: |
          pip install --quiet polars
          b=$(mktemp -d); DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$b" NCPU=$(nproc) ./bin-base
          tail -n +3 v.txt | while read label bin rest; do
            a=$(mktemp -d); env $rest DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a" NCPU=$(nproc) $bin
            echo "EXACT $label vs base: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
            a1=$(mktemp -d); env $rest DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$a1" NCPU=1 $bin
            echo "EXACT1 $label (1 thread) vs base: $(cd scripts && python3 compare.py "$a1" "$b" | tail -1)"
          done
      - name: Balance (stage3a per-thread)
        run: |
          for i in 1 2 3; do DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_ST3BAL=1 XL_TIMING=1 ./bin-base 2>&1 | grep -E "st3bal|\] ms:"; done
      - name: XPROF
        if: github.event.inputs.xprof != ''
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null
          for i in 1 2; do for x in base ${{ github.event.inputs.xprof }}; do
            echo "== xp-$x"; DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./xp-$x 2>&1 | grep -E "XPROF (scatter|passA|passB|runs|lflush|cred|purch|rows|TOTAL|per)"
          done; done
      - name: Timing
        run: python3 tools/st3time.py "$RUNNER_TEMP/p20" ${{ github.event.inputs.rounds }} v.txt
