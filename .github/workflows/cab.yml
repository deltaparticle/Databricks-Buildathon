name: cab

# Container A/B: build the root Dockerfile of this commit and of other refs,
# run each image with scorer flags alternately for many rounds on one machine
# (THP "always", the grader's setting), compare medians and outputs.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Space-separated git refs to compare against this commit"
        required: true
      rounds:
        required: false
        default: "20"
      parts:
        required: false
        default: '["a", "b", "c"]'

permissions:
  contents: read

jobs:
  cab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event.inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
          echo always | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
      - name: Build images and data
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
          docker build -q -t img_cur . > /dev/null
          echo cur > imgs.txt
          for r in ${{ github.event.inputs.refs }}; do
            lab=$(printf '%s' "$r" | tr -c 'a-zA-Z0-9' '_' | tr 'A-Z' 'a-z')
            sha=$(git rev-parse -q --verify "$r^{commit}" || git rev-parse -q --verify "origin/$r^{commit}" || { git fetch -q origin "$r" && git rev-parse FETCH_HEAD; })
            git worktree add -q "/tmp/w-$lab" "$sha"
            docker build -q -t "img_$lab" "/tmp/w-$lab" > /dev/null && echo "$lab" >> imgs.txt
          done
          cat imgs.txt
      - name: Alternating container runs
        run: |
          pip install --quiet polars
          N=$(nproc)
          run() {
            out=$(mktemp -d); chmod 777 "$out"
            s=$(date +%s.%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
              --cpus "$N" --memory 14g --memory-swap 14g --user 1000:1000 \
              -v "$RUNNER_TEMP/p20":/data:ro -v "$out":/output -e NCPU="$N" "img_$1" > /dev/null 2>&1
            code=$?; e=$(date +%s.%N)
            echo "$1 $code $(python3 -c "print(round($e-$s,4))")" >> t.txt
            echo "$out" > "last_$1"
          }
          for i in $(seq ${{ github.event.inputs.rounds }}); do
            for img in $(shuf imgs.txt); do run $img; done
          done
          for img in $(cat imgs.txt); do echo "$img output vs cur: $(cd scripts && python3 compare.py "$(cat ../last_$img)" "$(cat ../last_cur)" | tail -1)"; done
          python3 - <<'PY'
          import statistics as st
          rows = [l.split() for l in open("t.txt")]
          base = st.median([float(r[2]) for r in rows if r[0] == "cur" and r[1] == "0"])
          for img in [l.strip() for l in open("imgs.txt")]:
              w = [float(r[2]) for r in rows if r[0] == img and r[1] == "0"]
              print(f"{img:28s} container median {st.median(w):.4f}s ({(st.median(w)/base-1)*100:+.1f}% vs cur) n={len(w)}")
          PY
