name: bench

# Linux benchmark: build the real Docker image, run it the way the scorer does
# (read-only root, no network, uid 1000, CPU/memory limits) on a generated
# 20M-event dataset, and check correctness on the 36 fixtures.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Commit to A/B against (default: the previous commit)"
        required: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name|Thread|Core|Socket|L2|L3" || true
          free -g; df -h "$RUNNER_TEMP" | tail -1
          cat /sys/kernel/mm/transparent_hugepage/enabled || true

      - name: Build generator, C++ pipeline (shipped) and Rust pipeline (reference)
        run: |
          cargo build --release --manifest-path tools/gen-lowmem/Cargo.toml
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
          g++ -O3 -march=x86-64-v3 -mtune=skylake-avx512 -std=c++20 -pthread -o cppbin cpp/main.cpp cpp/fallback.cpp

      - name: Fixtures (native)
        run: |
          pip install --quiet polars
          echo "C++ (shipped):"; python3 scripts/run_fixtures.py fixtures -- "$PWD/cppbin" | tail -2
          echo "Rust (reference):"; python3 scripts/run_fixtures.py fixtures -- "$PWD/target/release/shopping" | tail -1

      - name: Generate data (20M events, seed 42; dev 1M, seed 1)
        run: |
          G=tools/gen-lowmem/target/release/generate
          time $G --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
          $G --seed 1 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/dev" 2>&1 | tail -1
          du -sh "$RUNNER_TEMP/p20"

      - name: Exact diff, C++ vs Rust reference (dev 1M and 20M)
        run: |
          for d in dev p20; do
            a=$(mktemp -d); b=$(mktemp -d)
            DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$a" NCPU=$(nproc) ./cppbin
            DATA_DIR="$RUNNER_TEMP/$d" OUTPUT_DIR="$b" NCPU=$(nproc) ./target/release/shopping
            echo "$d: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
          done

      - name: Docker build
        run: time docker build -t shopping:ci .

      - name: Container runs, scorer flags
        run: |
          CPUS=$(nproc)
          run() {
            data=$1; out=$(mktemp -d); scratch=$(mktemp -d); chmod 777 "$out" "$scratch"
            s=$(date +%s.%N)
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
              --cpus "$CPUS" --memory 14g --memory-swap 14g --user 1000:1000 \
              -v "$data":/data:ro -v "$out":/output -v "$scratch":/scratch \
              -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e HOME=/scratch \
              -e NCPU="$CPUS" -e SHOP_PROFILE=1 shopping:ci 2> "$out.err"
            code=$?
            e=$(date +%s.%N)
            echo "exit=$code wall=$(python3 -c "print(round($e-$s,3))")s :: $(grep -E 's (parse|dedup|relocate|sessions|write)$|cpu' "$out.err" | tr '\n' ' ' | tr -s ' ')"
            LAST_OUT=$out
          }
          echo "== dev"; run "$RUNNER_TEMP/dev"
          echo "== p20 (first run may be cold cache)"
          for i in 1 2 3 4 5; do run "$RUNNER_TEMP/p20"; done
          python3 - "$LAST_OUT" <<'EOF'
          import sys, glob, polars as pl
          o = sys.argv[1]
          u = pl.concat([pl.read_parquet(f) for f in glob.glob(f"{o}/user_daily/*.parquet")])
          c = pl.concat([pl.read_parquet(f) for f in glob.glob(f"{o}/campaign_daily/*.parquet")])
          print("user_daily rows", u.height, "sessions", u["sessions"].sum(), "events", u["events"].sum(), "revenue", u["revenue_cents"].sum())
          print("campaign_daily rows", c.height, "sessions", c["sessions"].sum(), "assisted", c["assisted_sessions"].sum())
          EOF

      - name: A/B native runs (shipped binary of this commit vs base, alternating, same machine)
        run: |
          BASE="${{ github.event.inputs.base }}"; BASE=${BASE:-$(git rev-parse HEAD~1)}
          echo "A = $(git rev-parse --short HEAD)   B = $(git rev-parse --short $BASE)"
          git worktree add -q /tmp/base "$BASE"
          shipped() {  # build the binary the commit's Dockerfile ships
            if [ -f "$1/cpp/main.cpp" ]; then
              g++ -O3 -march=x86-64-v3 -mtune=skylake-avx512 -std=c++20 -pthread -o "$2" "$1/cpp/main.cpp" "$1/cpp/fallback.cpp"
            else
              (cd "$1" && RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_TARGET_DIR=/tmp/t-$(basename $2) cargo build --release -q) && cp /tmp/t-$(basename $2)/release/shopping "$2"
            fi
          }
          shipped "$PWD" /tmp/binA; shipped /tmp/base /tmp/binB
          rm -f ab.txt
          for i in 1 2 3 4 5 6; do
            for which in A B; do
              /usr/bin/time -f "$which wall=%e user=%U sys=%S" env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) /tmp/bin$which > /dev/null 2>> ab.txt
            done
          done
          python3 - <<'PY'
          import statistics as st
          rows = [l.split() for l in open("ab.txt") if l.startswith(("A ", "B "))]
          for w in "AB":
              walls = [float(r[1][5:]) for r in rows if r[0] == w]
              users = [float(r[2][5:]) for r in rows if r[0] == w]
              print(f"{w}: median wall {st.median(walls):.3f}s  median user {st.median(users):.2f}s  (n={len(walls)})")
          PY

      - name: perf profile of the shipped C++ pipeline
        run: |
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          g++ -O3 -g -fno-omit-frame-pointer -march=x86-64-v3 -mtune=skylake-avx512 -std=c++20 -pthread -o /tmp/cpp_g cpp/main.cpp cpp/fallback.cpp
          DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) $PERF record -F 4999 -g -o perf.data /tmp/cpp_g 2>/dev/null
          echo "===== top symbols (self)"
          $PERF report -i perf.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -40
          echo "===== top source lines"
          $PERF report -i perf.data --no-children --sort srcline --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -150
          for fn in phase3_partition do_person forward_run phase2_partition stage2_events fast_event; do
            echo "===== lines in $fn"
            $PERF report -i perf.data --no-children --symbol-filter=$fn --sort srcline --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -25
          done
          echo "===== perf stat"
          $PERF stat -e task-clock,page-faults,context-switches,cpu-migrations env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) ./cppbin 2>&1 | tail -10
