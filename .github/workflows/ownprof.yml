name: ownprof

# perf profile of our own Rust pipeline on v5 20M data: top symbols and the
# hottest source lines of the top functions.
on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          [ -n "${{ github.event.inputs.ref }}" ] && git checkout -q "${{ github.event.inputs.ref }}"
          nproc; lscpu | grep "Model name"
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          CPU=x86-64-v3; grep -qw avx512bw /proc/cpuinfo && grep -qw avx512_vnni /proc/cpuinfo && CPU=cascadelake; echo "building for $CPU"
          RUSTFLAGS="-C target-cpu=$CPU -C force-frame-pointers=yes" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release -q
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1 || true
      - name: Data
        run: tools/generator/target/release/generate --seed 42 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/p20" 2>&1 | tail -1
      - name: Profile
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          sudo sysctl -w kernel.perf_event_paranoid=-1 >/dev/null; sudo sysctl -w kernel.kptr_restrict=0 >/dev/null
          B=target/release/shopping
          env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) SHOP_PROFILE=1 $B 2>&1 | tail -12
          $PERF record -q -F 9999 -g -o p.data env DATA_DIR="$RUNNER_TEMP/p20" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) $B >/dev/null 2>&1
          echo "===== symbols (self)"
          $PERF report -i p.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -40
          echo "===== symbols (children)"
          $PERF report -i p.data --children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -30
          for s in $($PERF report -i p.data --no-children --sort sym --stdio 2>/dev/null | grep -E "^ +[0-9]" | head -8 | sed -E 's/^ +[0-9.]+% +\[[.k]\] //' | tr ' ' '#'); do
            full=$(echo "$s" | tr '#' ' ')
            echo "===================== $full"
            $PERF annotate -i p.data --stdio -l "$full" 2>/dev/null | grep -E "^ +[0-9]+\.[0-9]+ +[a-z_/.]+\.rs:[0-9]+" | sort -nr | head -15
          done
