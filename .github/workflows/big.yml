name: big

# The final runs on ~60M events. Generate 60M with the official generator,
# time the shipped pipeline there (phases, memory), check its output against
# our Rust reference, then run a knob sweep at that size.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Variants file under tools/ for the sweep (empty = none)"
        required: false
        default: "sweep_big.txt"
      rounds:
        required: false
        default: "8"
      events:
        required: false
        default: "60000000"

permissions:
  contents: read

jobs:
  big:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep "Model name"; free -g; df -h "$RUNNER_TEMP" | tail -1
          for f in avx512f avx512bw avx512vl avx512dq avx512cd avx512_vnni; do
            grep -qw $f /proc/cpuinfo || { echo "::error::runner lacks $f; re-run the job"; exit 1; }
          done
      - name: Build
        run: |
          cargo build --release -q --manifest-path tools/generator/Cargo.toml
          (cd lane && cargo build --release -q) && cp lane/target/release/pipeline lanebin
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q
      - name: Data (official generator)
        run: |
          E=${{ github.event.inputs.events }}; C=$((E / 4))
          /usr/bin/time -f "generator: %e s, max RSS %M KB" tools/generator/target/release/generate --seed 77 --events $E --clicks $C --output "$RUNNER_TEMP/big" 2>&1 | tail -2
          du -sh "$RUNNER_TEMP/big"; free -g
      - name: Shipped pipeline at this size
        run: |
          for i in 1 2 3; do
            /usr/bin/time -f "wall=%e user=%U sys=%S maxrss=%MKB minflt=%R" env DATA_DIR="$RUNNER_TEMP/big" OUTPUT_DIR="$(mktemp -d)" NCPU=$(nproc) XL_TIMING=1 ./lanebin 2>&1 | grep -E "ms:|wall="
          done
      - name: Exact check against the Rust reference
        run: |
          pip install --quiet polars
          a=$(mktemp -d); b=$(mktemp -d)
          DATA_DIR="$RUNNER_TEMP/big" OUTPUT_DIR="$a" NCPU=$(nproc) ./lanebin
          DATA_DIR="$RUNNER_TEMP/big" OUTPUT_DIR="$b" NCPU=$(nproc) ./target/release/shopping
          echo "big vs reference: $(cd scripts && python3 compare.py "$a" "$b" | tail -1)"
      - name: Sweep
        if: github.event.inputs.variants != ''
        run: |
          build() { label=$1; shift; (cd lane && env "$@" CARGO_TARGET_DIR=/tmp/t-$label cargo build --release -q) && cp /tmp/t-$label/release/pipeline ./bin-$label || echo "build $label failed"; }
          grep -o "bin-[a-z0-9_]*" tools/${{ github.event.inputs.variants }} | sort -u | while read b; do
            label=${b#bin-}; spec=$(grep "^#build $label " tools/${{ github.event.inputs.variants }} | cut -d' ' -f3-); build $label $spec
          done
          python3 tools/sweep.py "$RUNNER_TEMP/big" ${{ github.event.inputs.rounds }} tools/${{ github.event.inputs.variants }}
